jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13.7"]   # или "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Python build deps
        run: python -m pip install -U pip setuptools wheel

      # 1) Собираем C++ DLL
      - name: Configure CMake (Release)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ library (Release)
        run: cmake --build build --config Release --parallel

      # 2) Находим и копируем DLL туда, где её точно ищет gpboost/libpath.py
      - name: Copy lib_gpboost.dll into python package
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter "lib_gpboost.dll" | Select-Object -First 1
          if (-not $dll) {
            Write-Host "DLL not found. Dumping build tree:"
            Get-ChildItem -Path build -Recurse | Select-Object FullName
            throw "lib_gpboost.dll not produced by build"
          }
          Copy-Item $dll.FullName "python-package\gpboost\lib_gpboost.dll" -Force
          Write-Host "Copied: $($dll.FullName) -> python-package\gpboost\lib_gpboost.dll"

      # 3) Собираем wheel (теперь setup.py найдёт DLL)
      - name: Build wheel
        working-directory: python-package
        run: python setup.py bdist_wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpboost-wheel-cp313-win_amd64
          path: python-package/dist/*.whl
